[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polima"
version = "0.1.0"
description = "PoLiMa - unified train/compile/deploy framework for robot policies on SiMa.ai Modalix"
readme = "README.md"
requires-python = ">=3.10"

# HARD FLOOR: numpy only.
#
# PoLiMa spans two machines, and the base install is what the BOARD gets:
#
#   HOST  (x86_64)                        BOARD (Modalix SoM, aarch64)
#   polima-train    torch + lerobot       polima        numpy only
#   polima-compile  afe + onnx + onnxsim  polima-run    numpy only
#   polima-deploy   ssh + rsync           polima-robot  flask + cv2 + lerobot 0.4.4
#
# Both halves share one core -- polima.policies, polima.wire, polima.bundle,
# polima.config, polima.util -- because that core IS the contract between them:
# the host writes bundle.json + plan.json, the board reads them. So the core must
# import with stdlib + numpy alone, in all three interpreters (the `act` conda
# env, the model-compiler venv which has afe but no torch, and the board's
# py3.11). Heavy imports happen lazily inside functions.
#
# `polima doctor --imports` proves this by importing the core in each
# interpreter; do not add a dependency here without re-running it.
dependencies = ["numpy"]

[project.optional-dependencies]
# Host-side stages.
train   = ["torch", "safetensors", "pyarrow", "draccus", "pyyaml"]
compile = ["onnx", "onnxsim", "onnxruntime", "pyyaml"]
deploy  = ["pyyaml"]
host    = ["polima[train,compile,deploy]"]
# Board-side. Deliberately excludes torch/afe: the board never trains or compiles.
robot   = ["flask", "opencv-python-headless"]
board   = ["polima[robot]"]
dev     = ["pytest", "ruff"]

[project.scripts]
# Umbrella, installed everywhere. `polima compile ...` == `polima-compile ...`.
polima = "polima.cli.main:main"
# Host stages -- mirrors llima-compile / llima-deploy.
polima-train = "polima.cli.entry:train"
polima-compile = "polima.cli.entry:compile_"
polima-deploy = "polima.cli.entry:deploy"
# Board stages -- mirrors llima-run.
polima-run = "polima.cli.entry:run_"
polima-robot = "polima.cli.entry:robot"
# Works on both; the first thing to run after any install.
polima-doctor = "polima.cli.entry:doctor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polima = ["robot/templates/*.html", "patches/*.patch"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["hardware: requires a Modalix board or an SO-101 arm (opt-in)"]

[tool.ruff]
line-length = 100
target-version = "py310"
